[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-contrastive-decomposition"
version = "0.2.1"
description = "Decomposition of Neurophysiological Time Series Signals with a Particle Swarm Optimised Independence Estimator"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [
    {name = "Agnese Grison", email = "agnese.grison16@imperial.ac.uk"}
]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["EMG", "neural signals", "decomposition", "particle swarm", "ICA", "blind source separation"]

dependencies = [
    "numpy>=1.23.4",
    "torch>=2.0.0",
    "scipy>=1.9.0",
    "mat73>=0.59",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[project.urls]
Homepage = "https://github.com/AgneGris/swarm-contrastive-decomposition"
Repository = "https://github.com/AgneGris/swarm-contrastive-decomposition"
Issues = "https://github.com/AgneGris/swarm-contrastive-decomposition/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scd*"]

[tool.setuptools.package-data]
scd = ["*.json"]
